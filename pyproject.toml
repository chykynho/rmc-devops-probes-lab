[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmc-probes-lab"
version = "1.0.0"
description = "Demonstração local de liveness e readiness com dependências simuladas"
requires-python = ">=3.12,<3.13"
dependencies = ["ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
